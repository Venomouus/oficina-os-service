name: CI - OS Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Install SonarScanner
        run: dotnet tool update dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar"

      - name: Restore
        run: dotnet restore Tests/OsService.Tests/OsService.Tests.csproj

      - name: Begin SonarCloud analysis
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin /k:"Venomouus_oficina-os-service" /o:"venomouus" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="Tests/OsService.Tests/TestResults/**/coverage.opencover.xml" /d:sonar.coverage.exclusions="**/*.ps1" /d:sonar.qualitygate.wait=true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: dotnet build Tests/OsService.Tests/OsService.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: pwsh ./scripts/verify-coverage.ps1 -Configuration Release

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-service-coverage
          path: Tests/OsService.Tests/TestResults/**/coverage.cobertura.xml

      - name: End SonarCloud analysis
        if: always()
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: docker build --tag oficina-os-service:${{ github.sha }} .

  distributed-bdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OS Service
        uses: actions/checkout@v4
      - name: Checkout Billing Service
        uses: actions/checkout@v4
        with:
          repository: Venomouus/oficina-billing-service
          ref: ${{ github.event_name == 'push' && 'main' || 'feat/fase4-bdd-coverage' }}
          path: Tests/dependencies/billing-service
      - name: Checkout Execution Service
        uses: actions/checkout@v4
        with:
          repository: Venomouus/oficina-execution-service
          ref: ${{ github.event_name == 'push' && 'main' || 'feat/fase4-bdd-coverage' }}
          path: Tests/dependencies/execution-service
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build services
        run: |
          dotnet build OsService.csproj -c Release
          dotnet build Tests/dependencies/billing-service/BillingService.csproj -c Release
          dotnet build Tests/dependencies/execution-service/ExecutionService.csproj -c Release
      - name: Run distributed BDD
        run: dotnet test Tests/Saga.E2E/Saga.E2E.csproj -c Release --logger "console;verbosity=normal"
        env:
          SAGA_BILLING_DIR: ${{ github.workspace }}/Tests/dependencies/billing-service
          SAGA_EXECUTION_DIR: ${{ github.workspace }}/Tests/dependencies/execution-service

  publish-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test-analyze, distributed-bdd]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        run: |
          docker build -t ghcr.io/venomouus/oficina-os-service:${{ github.sha }} -t ghcr.io/venomouus/oficina-os-service:latest .
          docker push ghcr.io/venomouus/oficina-os-service:${{ github.sha }}
          docker push ghcr.io/venomouus/oficina-os-service:latest
      - name: Deploy to Kubernetes
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64" || { echo 'Configure KUBE_CONFIG_B64 no repositorio'; exit 1; }
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl get namespace oficina
          kubectl -n oficina get secret messaging-secrets os-service-secrets
          kubectl -n oficina apply -f k8s/deployment.yaml
          kubectl -n oficina set image deployment/os-service os-service=ghcr.io/venomouus/oficina-os-service:${{ github.sha }}
          kubectl -n oficina rollout status deployment/os-service --timeout=180s
